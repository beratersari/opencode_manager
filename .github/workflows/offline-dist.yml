# Build four offline zips (Windows, Linux, macOS, plus Windows+Linux).
# Each zip has the matching bundled CPython, wheels, OpenCode CLI, and web/dist.
# Do not ship agents/.
# Target install never hits the network.

name: Offline Distribution

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package offline zips
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Product version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${{ github.ref_name }}"
            v="${v#v}"
          else
            v="$(tr -d '[:space:]' < VERSION)-g${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "dist_name=amir-mini-$v" >> "$GITHUB_OUTPUT"

      - name: Build distribution
        env:
          OSM_PRODUCT_VERSION: ${{ steps.ver.outputs.version }}
        run: python packaging/build_dist.py --out-dir dist --dist-name "${{ steps.ver.outputs.dist_name }}"

      - name: Assert zip payloads
        run: |
          set -euo pipefail
          prefix="${{ steps.ver.outputs.dist_name }}"
          declare -A NEED
          NEED[windows-x64]="vendor/python/windows/python.exe vendor/bin/windows/opencode.exe vendor/bin/windows/WinSW.exe"
          NEED[linux-x64]="vendor/python/linux/bin/python3 vendor/bin/linux/opencode"
          NEED[darwin]="vendor/python/darwin-arm64/bin/python3 vendor/python/darwin-x64/bin/python3 vendor/bin/darwin-arm64/opencode vendor/bin/darwin-x64/opencode"
          NEED[windows-linux]="vendor/python/windows/python.exe vendor/python/linux/bin/python3 vendor/bin/windows/opencode.exe vendor/bin/linux/opencode"
          for suffix in windows-x64 linux-x64 darwin windows-linux; do
            zip="dist/${prefix}-${suffix}.zip"
            stage="dist/stage/${prefix}-${suffix}"
            if [ ! -f "$zip" ]; then
              echo "Missing zip: $zip"
              exit 1
            fi
            echo "OK zip $zip ($(du -h "$zip" | awk '{print $1}'))"
            for rel in install.sh install.bat web/dist/index.html vendor/python-wheels src/opencode_manager/app.py ${NEED[$suffix]}; do
              if [ ! -e "$stage/$rel" ]; then
                echo "Missing $suffix path: $rel"
                exit 1
              fi
            done
            if [ "$suffix" = "windows-linux" ]; then
              for rel in settings.local.windows.yaml settings.local.linux.yaml; do
                if [ ! -e "$stage/$rel" ]; then
                  echo "Missing $suffix path: $rel"
                  exit 1
                fi
              done
              if [ -e "$stage/settings.local.yaml" ]; then
                echo "windows-linux zip must not ship a single settings.local.yaml"
                exit 1
              fi
            else
              if [ ! -e "$stage/settings.local.yaml" ]; then
                echo "Missing $suffix path: settings.local.yaml"
                exit 1
              fi
              if [ "$suffix" = "windows-x64" ] && ! grep -q 'C:\\osm' "$stage/settings.local.yaml"; then
                echo "windows zip settings.local.yaml must set C:\\osm"
                cat "$stage/settings.local.yaml"
                exit 1
              fi
              if [ "$suffix" = "linux-x64" ] && ! grep -q '/var/lib/osm' "$stage/settings.local.yaml"; then
                echo "linux zip settings.local.yaml must set /var/lib/osm"
                cat "$stage/settings.local.yaml"
                exit 1
              fi
            fi
            if [ -d "$stage/web/node_modules" ]; then
              echo "web/node_modules must not be in $suffix"
              exit 1
            fi
            if [ -d "$stage/agents" ]; then
              echo "agents/ must not be in $suffix"
              exit 1
            fi
            shopt -s nullglob
            yaml_wheels=("$stage"/vendor/python-wheels/[Pp]y[Yy]AML-*.whl "$stage"/vendor/python-wheels/pyyaml-*.whl)
            core_wheels=("$stage"/vendor/python-wheels/pydantic_core-*.whl)
            shopt -u nullglob
            if [ ${#yaml_wheels[@]} -eq 0 ]; then
              echo "PyYAML wheel missing in $suffix"
              ls -1 "$stage/vendor/python-wheels" || true
              exit 1
            fi
            if [ ${#core_wheels[@]} -eq 0 ]; then
              echo "pydantic-core wheel missing in $suffix"
              ls -1 "$stage/vendor/python-wheels" || true
              exit 1
            fi
            if [ "$suffix" = "windows-x64" ] || [ "$suffix" = "windows-linux" ]; then
              if ! ls "$stage"/vendor/python-wheels/[Pp]y[Yy]AML-*win_amd64*.whl >/dev/null 2>&1 \
                && ! ls "$stage"/vendor/python-wheels/pyyaml-*win_amd64*.whl >/dev/null 2>&1; then
                echo "Windows PyYAML wheel missing in $suffix"
                ls -1 "$stage/vendor/python-wheels" || true
                exit 1
              fi
              if ! ls "$stage"/vendor/python-wheels/pydantic_core-*win_amd64*.whl >/dev/null 2>&1; then
                echo "Windows pydantic-core wheel missing in $suffix"
                ls -1 "$stage/vendor/python-wheels" || true
                exit 1
              fi
            fi
            if [ "$suffix" = "windows-x64" ] && [ -e "$stage/vendor/python/linux" ]; then
              echo "windows zip must not include linux python"
              exit 1
            fi
            if [ "$suffix" = "linux-x64" ] && [ -e "$stage/vendor/python/windows" ]; then
              echo "linux zip must not include windows python"
              exit 1
            fi
            if [ "$suffix" = "darwin" ] && [ -e "$stage/vendor/python/linux" ]; then
              echo "darwin zip must not include linux python"
              exit 1
            fi
            if [ "$suffix" = "windows-linux" ] && [ -e "$stage/vendor/python/darwin-arm64" ]; then
              echo "windows-linux zip must not include darwin python"
              exit 1
            fi
          done
          count=$(ls -1 dist/${prefix}-*.zip | wc -l)
          if [ "$count" -ne 4 ]; then
            echo "Expected 4 zips, found $count"
            ls -l dist/*.zip
            exit 1
          fi
          echo "Four-zip payload OK"

      - name: Build OpenCode 1.18.10 installer zips
        run: python packaging/build_opencode_dist.py --out-dir dist

      - name: Assert OpenCode installer zips
        run: |
          set -euo pipefail
          for suffix in windows-x64 linux-x64; do
            stage="dist/stage/amir-mini-opencode-1.18.10-${suffix}"
            zip="dist/amir-mini-opencode-1.18.10-${suffix}.zip"
            if [ ! -f "$zip" ]; then
              echo "Missing $zip"
              exit 1
            fi
            got="$(tr -d '[:space:]' < "$stage/OPENCODE_VERSION.txt")"
            if [ "$got" != "1.18.10" ]; then
              echo "OpenCode installer must be 1.18.10, found $got"
              exit 1
            fi
          done
          test -f dist/stage/amir-mini-opencode-1.18.10-windows-x64/vendor/bin/windows/opencode.exe
          test -f dist/stage/amir-mini-opencode-1.18.10-linux-x64/vendor/bin/linux/opencode
          test -f dist/stage/amir-mini-opencode-1.18.10-windows-x64/install.bat
          test -f dist/stage/amir-mini-opencode-1.18.10-linux-x64/install.sh
          echo "OpenCode 1.18.10 installer zips OK"

      # upload-artifact always wraps the path in a zip. Upload the staged
      # folder (not the payload .zip) so a download extracts install.bat /
      # vendor/ directly. Tag releases still attach the real .zip files below.
      - name: Upload Windows payload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.dist_name }}-windows-x64
          path: dist/stage/${{ steps.ver.outputs.dist_name }}-windows-x64/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux payload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.dist_name }}-linux-x64
          path: dist/stage/${{ steps.ver.outputs.dist_name }}-linux-x64/
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS payload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.dist_name }}-darwin
          path: dist/stage/${{ steps.ver.outputs.dist_name }}-darwin/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows+Linux payload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.dist_name }}-windows-linux
          path: dist/stage/${{ steps.ver.outputs.dist_name }}-windows-linux/
          if-no-files-found: error
          retention-days: 30

      - name: Upload OpenCode 1.18.10 Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: amir-mini-opencode-1.18.10-windows-x64
          path: dist/stage/amir-mini-opencode-1.18.10-windows-x64/
          if-no-files-found: error
          retention-days: 30

      - name: Upload OpenCode 1.18.10 Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: amir-mini-opencode-1.18.10-linux-x64
          path: dist/stage/amir-mini-opencode-1.18.10-linux-x64/
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ steps.ver.outputs.dist_name }}-windows-x64.zip
            dist/${{ steps.ver.outputs.dist_name }}-linux-x64.zip
            dist/${{ steps.ver.outputs.dist_name }}-darwin.zip
            dist/${{ steps.ver.outputs.dist_name }}-windows-linux.zip
            dist/amir-mini-opencode-1.18.10-windows-x64.zip
            dist/amir-mini-opencode-1.18.10-linux-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Offline installer

            Download the zip for your OS (or the combined Windows+Linux zip):

            - `${{ steps.ver.outputs.dist_name }}-windows-x64.zip`
            - `${{ steps.ver.outputs.dist_name }}-linux-x64.zip`
            - `${{ steps.ver.outputs.dist_name }}-darwin.zip` (Apple Silicon + Intel)
            - `${{ steps.ver.outputs.dist_name }}-windows-linux.zip` (Windows + Linux together)

            1. Extract once. Install Git. Python is in the zip (`vendor/python/`).
            2. Windows: `install.bat` then `install-opencode.bat`
               macOS / Linux: `./install.sh` then `./install-opencode.sh`
            3. `start.bat` / `./start.sh`
               - API + SPA: http://127.0.0.1:8080/jobs
               - Optional SPA proxy: http://127.0.0.1:5173/

            ## Single-file exe (Windows + Linux)

            Also attached: `${{ steps.ver.outputs.dist_name }}-windows-x64.exe` and
            `${{ steps.ver.outputs.dist_name }}-linux-x64`. One file, no `install.bat`.
            Still needs Git and OpenCode on PATH. Starts API + SPA and the :5173 proxy.

            ## Offline OpenCode 1.18.10 installer

            Separate artifact (OpenCode CLI only, always 1.18.10):

            - `amir-mini-opencode-1.18.10-windows-x64.zip` — `install.bat`
            - `amir-mini-opencode-1.18.10-linux-x64.zip` — `./install.sh`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  exe:
    name: Single-file exe (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows-x64
            ext: .exe
          - os: ubuntu-latest
            suffix: linux-x64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Product version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${{ github.ref_name }}"
            v="${v#v}"
          else
            v="$(tr -d '[:space:]' < VERSION)-g${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "dist_name=amir-mini-$v" >> "$GITHUB_OUTPUT"

      - name: Install Python package + PyInstaller
        run: python -m pip install -e ".[exe]"

      - name: Build SPA
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build single-file exe
        env:
          OSM_PRODUCT_VERSION: ${{ steps.ver.outputs.version }}
        run: python packaging/build_exe.py --out-dir dist

      - name: Assert one executable
        shell: bash
        run: |
          set -euo pipefail
          suffix="${{ matrix.suffix }}"
          prefix="${{ steps.ver.outputs.dist_name }}"
          if [ "$suffix" = "windows-x64" ]; then
            file="dist/${prefix}-${suffix}.exe"
          else
            file="dist/${prefix}-${suffix}"
          fi
          if [ ! -f "$file" ]; then
            echo "Missing exe: $file"
            ls -la dist || true
            exit 1
          fi
          count=$(find dist -maxdepth 1 -type f ! -name '*.spec' | wc -l)
          echo "OK $file ($(du -h "$file" | awk '{print $1}')) files_in_dist_root=$count"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.dist_name }}-${{ matrix.suffix }}-exe
          path: |
            dist/${{ steps.ver.outputs.dist_name }}-${{ matrix.suffix }}${{ matrix.ext }}
            dist/settings.local.yaml
          if-no-files-found: error
          retention-days: 30

  attach-exe-release:
    name: Attach exes to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download exe artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-exe'
          merge-multiple: false
          path: dist-exes

      - name: Stage release files
        run: |
          set -euo pipefail
          mkdir -p release-exes
          for dir in dist-exes/*; do
            [ -d "$dir" ] || continue
            name="$(basename "$dir")"
            find "$dir" -maxdepth 1 -type f ! -name 'settings.local.yaml' -exec cp {} release-exes/ \;
            if echo "$name" | grep -q windows; then
              cp "$dir/settings.local.yaml" release-exes/settings.local.windows.yaml
            else
              cp "$dir/settings.local.yaml" release-exes/settings.local.linux.yaml
            fi
          done
          ls -la release-exes

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-exes/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
