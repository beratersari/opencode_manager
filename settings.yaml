# Bind address. 0.0.0.0 = all interfaces; 127.0.0.1 = this machine only.
listen_host: 0.0.0.0
# Inbound HTTP port (POST /jobs, dashboard, /api).
listen_port: 4096
# How many OpenCode jobs may run at once. Extra tickets queue.
max_concurrent_jobs: 2
# Seconds to wait for one callback HTTP POST.
callback_timeout_seconds: 15
# How many times to retry a failed callback (5xx / network).
callback_retry_count: 3
# Host allow-list for callback_url (SSRF).
# [] or ["*"] = accept any http(s) URL from the request.
# Example restrict: ["n8n.example.com", "*.n8n.cloud"]
callback_allowed_hosts: ["*"]
# One root for everything OSM writes:
#   .temp/ clones, .serve/ serve logs, logs/, jobs/, queue.json
# Omit data_dir to use the OS default (Windows C:\osm, Linux /var/lib/osm).
# Override here or in settings.local.yaml (gitignored).
# On Linux, install.sh writes settings.local.yaml to
# $XDG_DATA_HOME/osm (or ~/.local/share/osm) when /var/lib/osm is not writable.
# Minimum log level: DEBUG, INFO, WARNING, ERROR, CRITICAL.
log_level: INFO
# OpenCode CLI (PATH name or absolute path).
opencode_bin: opencode
# Seconds with no first assistant answer (busy, not compacting) before hang retry.
hang_timeout_seconds: 180
# Seconds allowed for git clone / ls-remote (30 minutes).
git_clone_timeout_seconds: 1800
# First outer-retry backoff, seconds.
retry_backoff_seconds: 2
# Cap on exponential backoff between OpenCode attempts, seconds.
retry_backoff_cap_seconds: 30
# Optional overlay (gitignored): settings.local.yaml
