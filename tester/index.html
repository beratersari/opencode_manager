<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OSM job tester</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020; --panel: #162038; --border: #2c3a5e;
      --text: #f4f6ff; --muted: #7b88a8; --accent: #ff7a45;
      --ok: #3ecf8e; --bad: #f25c54;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    main { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1.2rem 3rem; }
    h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
    .sub { color: var(--muted); font-size: .9rem; margin-bottom: 1.2rem; }
    .grid { display: grid; gap: 1rem; }
    @media (min-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } }
    form, .inbox { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 1rem; }
    label { display: block; font-size: .75rem; color: var(--muted); margin: .55rem 0 .2rem; }
    input, textarea, select {
      width: 100%; background: #0b1020; color: var(--text);
      border: 1px solid var(--border); border-radius: 8px; padding: .5rem .65rem; font: inherit;
    }
    textarea { min-height: 7rem; font-family: ui-monospace, Consolas, monospace; font-size: .85rem; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
    button {
      margin-top: .9rem; border: 0; border-radius: 999px; padding: .55rem 1.1rem;
      background: var(--accent); color: #1a0d08; font-weight: 700; cursor: pointer;
    }
    button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); margin-left: .4rem; }
    .pill { display: inline-block; border-radius: 999px; padding: .1rem .55rem; font-size: .75rem; font-weight: 700; }
    .pill.ack { background: #5b9dff22; color: #b3d0ff; }
    .pill.callback { background: #3ecf8e22; color: var(--ok); }
    .event { border-top: 1px solid var(--border); padding: .7rem 0; }
    .event:first-child { border-top: 0; }
    pre { white-space: pre-wrap; word-break: break-word; font-size: .78rem; color: #b4bfd9; margin: .4rem 0 0; }
    .meta { font-size: .75rem; color: var(--muted); }
    .head { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
    .err { color: var(--bad); }
  </style>
</head>
<body>
  <main>
    <h1>OSM job tester</h1>
    <p class="sub">Sends <code>POST /jobs</code> to the manager and listens here for the one terminal callback. Test only — not n8n.</p>
    <div class="grid">
      <form id="form">
        <label>OSM target is whatever this process was started with. Callback is this app.</label>
        <div class="row">
          <div>
            <label>jira_id</label>
            <input name="jira_id" placeholder="TEST-1" />
          </div>
          <div>
            <label>session_id (optional)</label>
            <input name="session_id" placeholder="ses_…" />
          </div>
        </div>
        <label>repo_url</label>
        <input name="repo_url" required placeholder="https://gitlab.example/group/repo.git" />
        <label>PAT</label>
        <input name="PAT" type="password" required />
        <div class="row">
          <div>
            <label>source_branch</label>
            <input name="source_branch" required value="main" />
          </div>
          <div>
            <label>agent_mode</label>
            <select name="agent_mode">
              <option>build</option>
              <option>plan</option>
              <option>general</option>
              <option>explore</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div>
            <label>model</label>
            <input name="model" required value="opencode/hy3-free" />
          </div>
          <div>
            <label>timeout_in_seconds</label>
            <input name="timeout_in_seconds" type="number" min="1" value="1800" />
          </div>
        </div>
        <label>retry_count</label>
        <input name="retry_count" type="number" min="1" value="1" />
        <label>prompt</label>
        <textarea name="prompt" required>Do not use tools. Reply with hello and nothing else.</textarea>
        <button type="submit">Send job</button>
        <button type="button" class="ghost" id="clear">Clear inbox</button>
      </form>
      <section class="inbox">
        <div class="head">
          <strong>Inbox</strong>
          <span class="meta" id="meta"></span>
        </div>
        <div id="list"></div>
      </section>
    </div>
  </main>
  <script>
    const list = document.getElementById('list')
    const meta = document.getElementById('meta')
    const form = document.getElementById('form')

    function render(data) {
      meta.textContent = data.callback_url || ''
      const events = data.events || []
      if (!events.length) {
        list.innerHTML = '<p class="meta">Waiting for acks and callbacks…</p>'
        return
      }
      list.innerHTML = events.map((ev) => {
        const body = ev.body || {}
        const code = ev.http_status ?? body.status_code
        const kind = ev.kind || '?'
        const text = body.text || ''
        const ids = [body.job_id, body.jira_id, body.session_id].filter(Boolean).join(' · ')
        return `<article class="event">
          <div><span class="pill ${kind}">${kind}</span>
            <span class="meta"> HTTP ${code} · ${ev.received_at || ''}</span></div>
          <div class="meta">${ids}</div>
          <pre>${escapeHtml(text)}</pre>
        </article>`
      }).join('')
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, (c) => (
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
      ))
    }

    async function refresh() {
      const res = await fetch('/inbox')
      render(await res.json())
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      const fd = new FormData(form)
      const payload = Object.fromEntries(fd.entries())
      payload.timeout_in_seconds = Number(payload.timeout_in_seconds)
      payload.retry_count = Number(payload.retry_count)
      const res = await fetch('/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      })
      const out = await res.json()
      if (out.body && out.body.session_id) {
        form.session_id.value = out.body.session_id
      }
      await refresh()
    })

    document.getElementById('clear').addEventListener('click', async () => {
      await fetch('/clear', { method: 'POST' })
      await refresh()
    })

    refresh()
    setInterval(refresh, 1500)
  </script>
</body>
</html>
